<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Lite - 終極完整版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 20px; padding-bottom: 160px; }
        h1 { color: #1DB954; margin-bottom: 16px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 24px; }
        input { flex: 1; padding: 14px 18px; border-radius: 25px; border: 1px solid #333; background: #242424; color: #fff; outline: none; }
        button { padding: 14px 24px; border-radius: 25px; border: none; background: #1DB954; color: #fff; font-weight: bold; cursor: pointer; }
        .card { display: flex; align-items: center; gap: 16px; background: #181818; padding: 12px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; }
        .card:hover { background: #282828; }
        .card img { width: 56px; height: 56px; border-radius: 6px; }
        .card-info { flex: 1; }
        .player-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #181818; border-top: 1px solid #282828; padding: 16px 20px; display: flex; align-items: center; gap: 20px; }
        audio { flex: 1; }
    </style>
</head>
<body>

    <h1>🎵 Spotify Lite (Flask 後端穩定版)</h1>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜尋歌曲或歌手 (例如: sugar, 周杰倫)...">
        <button id="searchBtn">搜尋</button>
    </div>

    <div id="results"></div>

    <div class="player-panel">
        <div style="min-width: 180px;">
            <div id="current-title" style="font-weight: bold; font-size: 14px;">尚未播放</div>
            <div id="current-artist" style="color: #b3b3b3; font-size: 12px;">點擊歌曲開始播放</div>
        </div>
        <audio id="audio-player" controls autoplay></audio>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('results');
        const audioPlayer = document.getElementById('audio-player');

        async function runSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            resultsContainer.innerHTML = '<p style="color:#1DB954;">⏳ 搜尋中...</p>';

            // 使用 iTunes API 抓取歌曲資訊與高畫質封面
            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=15`);
            const data = await res.json();
            
            resultsContainer.innerHTML = '';
            data.results.forEach(song => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <img src="${song.artworkUrl100.replace('100x100bb', '300x300bb')}">
                    <div class="card-info">
                        <div><b>${song.trackName}</b></div>
                        <div style="color:#aaa; font-size:13px;">${song.artistName}</div>
                    </div>
                    <button style="padding:8px 16px; font-size:12px;">▶ 播放完整版</button>
                `;
                div.onclick = () => playSong(song.artistName, song.trackName, div.querySelector('button'));
                resultsContainer.appendChild(div);
            });
        }

        async function playSong(artist, title, btnEl) {
            const originalText = btnEl.innerText;
            btnEl.innerText = "⏳ 載入完整音訊...";
            document.getElementById('current-title').innerText = title;
            document.getElementById('current-artist').innerText = artist;

            try {
                // 呼叫我們自己的 Flask 後端 API 獲取音訊串流
                const res = await fetch(`/api/get_audio?q=${encodeURIComponent(artist + ' ' + title + ' audio')}`);
                const data = await res.json();

                if (data.audio_url) {
                    audioPlayer.src = data.audio_url;
                    audioPlayer.play();
                    btnEl.innerText = "♪ 播放中";
                } else {
                    alert("無法獲取音訊串流");
                    btnEl.innerText = originalText;
                }
            } catch (err) {
                alert("後端連線失敗！");
                btnEl.innerText = originalText;
            }
        }

        searchBtn.onclick = runSearch;
        searchInput.onkeyup = (e) => { if (e.key === 'Enter') runSearch(); };
    </script>
</body>
</html>
