<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Lite - 完整版播放器</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            background: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px; 
            padding-bottom: 180px; 
        }

        .header h1 { 
            margin-bottom: 16px; 
            font-size: 28px; 
            color: #1DB954; 
        }

        .search-bar { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 24px; 
        }

        input { 
            flex: 1; 
            padding: 14px 18px; 
            border-radius: 25px; 
            border: 1px solid #333; 
            background: #242424; 
            color: #fff; 
            outline: none; 
            font-size: 15px; 
        }
        input:focus { 
            border-color: #1DB954; 
        }

        button.src-btn { 
            padding: 14px 24px; 
            border-radius: 25px; 
            border: none; 
            background: #1DB954; 
            color: #fff; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer; 
            transition: 0.2s;
        }
        button.src-btn:hover { 
            background: #1ed760; 
            transform: scale(1.02);
        }

        .section-title { 
            font-size: 18px; 
            font-weight: bold; 
            margin-bottom: 16px; 
            color: #b3b3b3; 
        }

        .card { 
            display: flex; 
            align-items: center; 
            gap: 16px; 
            background: #181818; 
            padding: 12px 16px; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        .card:hover { 
            background: #282828; 
        }
        .card img { 
            width: 56px; 
            height: 56px; 
            border-radius: 6px; 
            object-fit: cover; 
        }
        .card-info { 
            flex: 1; 
            overflow: hidden; 
        }
        .card-title { 
            font-weight: 600; 
            font-size: 16px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            margin-bottom: 4px; 
        }
        .card-artist { 
            color: #b3b3b3; 
            font-size: 13px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        .play-btn-ic { 
            background: #1DB954; 
            color: #fff; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 13px;
            cursor: pointer; 
        }

        /* 底部播放控制面板 */
        .player-panel { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: #181818; 
            border-top: 1px solid #282828; 
            padding: 16px 20px; 
            z-index: 999;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .player-left {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 260px;
        }

        .player-left img {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
        }

        .player-info {
            overflow: hidden;
        }

        .player-title {
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-artist {
            font-size: 12px;
            color: #b3b3b3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 將影片區域縮小並隱藏成精美音訊卡片 */
        .player-center {
            flex: 1;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        #yt-player-element {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎵 Spotify Lite (方案 C 完整版)</h1>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜尋歌曲或歌手 (例如: sugar, Maroon 5)...">
        <button class="src-btn" id="searchBtn">搜尋</button>
    </div>

    <div class="section-title">搜尋結果</div>
    <div id="results"></div>

    <!-- 底部播放面板 -->
    <div class="player-panel">
        <div class="player-left">
            <img id="current-cover" src="https://via.placeholder.com/50?text=Music" alt="封面">
            <div class="player-info">
                <div id="current-title" class="player-title">尚未播放</div>
                <div id="current-artist" class="player-artist">點擊列表歌曲開始播放完整版</div>
            </div>
        </div>

        <div class="player-center">
            <div id="yt-player-element"></div>
        </div>
    </div>

    <!-- 載入 YouTube 官方 API 腳本 -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let ytPlayer = null;
        let isApiReady = false;

        // YouTube API 初始化完成回呼
        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player-element', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'modestbranding': 1,
                    'rel': 0
                },
                events: {
                    'onReady': () => { isApiReady = true; }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const resultsContainer = document.getElementById('results');

            searchInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') runSearch();
            });

            searchBtn.addEventListener('click', runSearch);

            // 搜尋 Apple / iTunes 免費庫取得精準元數據
            async function fetchMusic(query) {
                const url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=15`;
                const response = await fetch(url);
                if (!response.ok) throw new Error("網路連線失敗");
                const data = await response.json();
                
                return (data.results || []).map(item => ({
                    title: item.trackName || "未知歌名",
                    artist: item.artistName || "未知歌手",
                    cover: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '300x300bb') : 'https://via.placeholder.com/300',
                    query: `${item.artistName} ${item.trackName} audio`
                }));
            }

            // 透過公開的第三方無 CORS 介面將「歌名」轉為可播放的「YouTube Video ID」
            async function getYouTubeVideoId(searchQuery) {
                try {
                    const res = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(searchQuery)}&filter=music_songs`);
                    const data = await res.json();
                    if (data.items && data.items.length > 0) {
                        // 取得第一筆音訊的 ID
                        return data.items[0].url.split('v=')[1];
                    }
                } catch (e) {
                    console.log("備用頻道解析...");
                }

                // 備用解析頻道，確保雙重保險
                const fallbackRes = await fetch(`https://api.viddl.is/search?q=${encodeURIComponent(searchQuery)}`);
                const fallbackData = await fallbackRes.json();
                return fallbackData[0]?.id || null;
            }

            // 執行搜尋
            async function runSearch() {
                const query = searchInput.value.trim();
                if (!query) return alert("請輸入歌名或歌手！");

                resultsContainer.innerHTML = '<p style="color:#1DB954;">⏳ 正在搜尋音樂庫...</p>';

                try {
                    const songs = await fetchMusic(query);
                    resultsContainer.innerHTML = '';

                    if (songs.length === 0) {
                        resultsContainer.innerHTML = '<p style="color:#888;">❌ 找不到相關歌曲，請嘗試更換關鍵字。</p>';
                        return;
                    }

                    songs.forEach(song => {
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `
                            <img src="${song.cover}" onerror="this.src='https://via.placeholder.com/56'">
                            <div class="card-info">
                                <div class="card-title">${song.title}</div>
                                <div class="card-artist">${song.artist}</div>
                            </div>
                            <button class="play-btn-ic">▶ 播放完整版</button>
                        `;
                        div.onclick = () => playSong(song, div.querySelector('.play-btn-ic'));
                        resultsContainer.appendChild(div);
                    });
                } catch (err) {
                    console.error(err);
                    resultsContainer.innerHTML = '<p style="color:red;">搜尋失敗，請檢查網路連線。</p>';
                }
            }

            // 點擊歌曲並播放
            async function playSong(song, btnEl) {
                const originalText = btnEl.innerText;
                btnEl.innerText = "⏳ 載入中...";

                document.getElementById('current-title').innerText = song.title;
                document.getElementById('current-artist').innerText = song.artist;
                document.getElementById('current-cover').src = song.cover;

                const videoId = await getYouTubeVideoId(song.query);

                if (videoId && ytPlayer && isApiReady) {
                    // 使用官方 JS API 加載影片，能避開一般 iframe 搜尋頁面的 embed 封鎖限制
                    ytPlayer.loadVideoById(videoId);
                    btnEl.innerText = "♪ 播放中";
                } else {
                    alert("無法獲取該歌曲的完整版音訊，請嘗試點擊其他版本！");
                    btnEl.innerText = originalText;
                }
            }
        });
    </script>
</body>
</html>
