<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Lite</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color:#121212; color:#fff; font-family:sans-serif; margin:0; padding:16px;">

    <div style="display:flex; gap:8px; margin-bottom:16px;">
        <input type="text" id="searchInput" placeholder="輸入歌名..." style="flex:1; padding:10px; border-radius:20px; border:none; outline:none; background:#242424; color:#fff;">
        <button id="searchBtn" style="padding:10px 16px; border-radius:20px; border:none; background:#1DB954; color:#fff; font-weight:bold; cursor:pointer;">搜尋</button>
    </div>

    <h3>❤️ 我的最愛</h3>
    <div id="favorites-list" style="margin-bottom:20px;"></div>

    <h3>🔍 搜尋結果</h3>
    <div id="results" style="margin-bottom:20px; min-height:50px;"></div>

    <h3>📜 待播清單</h3>
    <div id="queue-list" style="margin-bottom:80px;"></div>

    <!-- 底部播放器 -->
    <div style="position:fixed; bottom:0; left:0; right:0; background:#181818; padding:12px; border-top:1px solid #282828; display:flex; align-items:center; gap:12px;">
        <img id="cover" src="https://via.placeholder.com/48" style="width:48px; height:48px; border-radius:4px; object-fit:cover;">
        <div style="flex:1; overflow:hidden;">
            <div id="track-title" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:bold;">未播放歌曲</div>
            <div id="track-artist" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#b3b3b3; font-size:12px;">--</div>
        </div>
        <button id="play-btn" onclick="togglePlay()" style="background:#1DB954; border:none; width:40px; height:40px; border-radius:50%; color:#fff; font-size:18px; cursor:pointer;">▶</button>
    </div>

    <audio id="audio-element"></audio>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
