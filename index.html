<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Lite - 完整版</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body { 
            background: #121212; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            padding: 20px; 
            padding-bottom: 220px; 
        }

        .header h1 { 
            margin-bottom: 16px; 
            font-size: 28px; 
            color: #1DB954; 
        }

        .search-bar { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 24px; 
        }

        input { 
            flex: 1; 
            padding: 14px 18px; 
            border-radius: 25px; 
            border: 1px solid #333; 
            background: #242424; 
            color: #fff; 
            outline: none; 
            font-size: 15px; 
        }
        input:focus { 
            border-color: #1DB954; 
        }

        button.src-btn { 
            padding: 14px 24px; 
            border-radius: 25px; 
            border: none; 
            background: #1DB954; 
            color: #fff; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer; 
            transition: 0.2s;
        }
        button.src-btn:hover { 
            background: #1ed760; 
            transform: scale(1.02);
        }

        .section-title { 
            font-size: 18px; 
            font-weight: bold; 
            margin-bottom: 16px; 
            color: #b3b3b3; 
        }

        .card { 
            display: flex; 
            align-items: center; 
            gap: 16px; 
            background: #181818; 
            padding: 12px 16px; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s;
        }
        .card:hover { 
            background: #282828; 
        }
        .card img { 
            width: 56px; 
            height: 56px; 
            border-radius: 6px; 
            object-fit: cover; 
        }
        .card-info { 
            flex: 1; 
            overflow: hidden; 
        }
        .card-title { 
            font-weight: 600; 
            font-size: 16px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            margin-bottom: 4px; 
        }
        .card-artist { 
            color: #b3b3b3; 
            font-size: 13px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        .play-btn-ic { 
            background: #1DB954; 
            color: #fff; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 13px;
            cursor: pointer; 
        }

        /* 底部播放控制區 */
        .player-panel { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: #181818; 
            border-top: 1px solid #282828; 
            padding: 16px 20px; 
            z-index: 999;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }
        .player-header { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            margin-bottom: 12px;
        }
        .player-header img { 
            width: 48px; 
            height: 48px; 
            border-radius: 4px; 
            object-fit: cover; 
        }
        .player-info { 
            flex: 1; 
            overflow: hidden; 
        }
        .player-title { 
            font-weight: bold; 
            font-size: 15px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .player-artist { 
            color: #b3b3b3; 
            font-size: 13px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        /* 隱藏 YouTube 播放器區域，保持音樂播放元件的介面一致 */
        .iframe-container {
            width: 100%;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎵 Spotify Lite (完整版)</h1>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜尋完整歌曲或歌手 (例如: sugar, 告白氣球)...">
        <button class="src-btn" id="searchBtn">搜尋</button>
    </div>

    <div class="section-title">搜尋結果</div>
    <div id="results"></div>

    <!-- 底部音樂播放控制面板 -->
    <div class="player-panel">
        <div class="player-header">
            <img id="cover" src="https://via.placeholder.com/48?text=Music" alt="封面">
            <div class="player-info">
                <div id="track-title" class="player-title">尚未選擇歌曲</div>
                <div id="track-artist" class="player-artist">點擊列表歌曲即可開始播放完整版</div>
            </div>
        </div>
        
        <div class="iframe-container">
            <iframe id="yt-player" src="about:blank" allow="autoplay; encrypted-media"></iframe>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const resultsContainer = document.getElementById('results');
            const ytPlayer = document.getElementById('yt-player');

            // 備用公共 API 伺服器清單（避免單一節點失效）
            const API_NODES = [
                "https://pipedapi.kavin.rocks",
                "https://api.piped.privacydev.net",
                "https://piped-api.garudalinux.org"
            ];

            searchInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') runSearch();
            });

            searchBtn.addEventListener('click', runSearch);

            // 輪詢嘗試可用的 API 節點
            async function fetchWithFallback(endpoint) {
                for (const node of API_NODES) {
                    try {
                        const res = await fetch(`${node}${endpoint}`);
                        if (res.ok) return await res.json();
                    } catch (e) {
                        console.warn(`節點 ${node} 連線失敗，嘗試下一個...`);
                    }
                }
                throw new Error("所有 API 節點均無法連線");
            }

            // 搜尋完整音樂
            async function runSearch() {
                const query = searchInput.value.trim();
                if (!query) return alert("請輸入歌名或歌手！");

                resultsContainer.innerHTML = '<p style="color:#1DB954;">⏳ 正在搜尋完整音樂庫...</p>';

                try {
                    const data = await fetchWithFallback(`/search?q=${encodeURIComponent(query)}&filter=music_songs`);
                    resultsContainer.innerHTML = '';

                    const items = (data.items || []).filter(item => item.type === 'stream');

                    if (items.length === 0) {
                        resultsContainer.innerHTML = '<p style="color:#888;">❌ 找不到相關歌曲，請嘗試更換關鍵字。</p>';
                        return;
                    }

                    items.slice(0, 15).forEach(song => {
                        const videoId = song.url.replace('/watch?v=', '');
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `
                            <img src="${song.thumbnail}" onerror="this.src='https://via.placeholder.com/56'">
                            <div class="card-info">
                                <div class="card-title">${song.title}</div>
                                <div class="card-artist">${song.uploaderName || '未知歌手'}</div>
                            </div>
                            <button class="play-btn-ic">▶ 播放完整版</button>
                        `;
                        div.onclick = () => playSong(song.title, song.uploaderName, song.thumbnail, videoId);
                        resultsContainer.appendChild(div);
                    });
                } catch (err) {
                    console.error(err);
                    resultsContainer.innerHTML = '<p style="color:red;">連線失敗，請檢查網路或稍後再試。</p>';
                }
            }

            // 點擊音樂卡片播放完整音樂
            function playSong(title, artist, cover, videoId) {
                document.getElementById('track-title').innerText = title;
                document.getElementById('track-artist').innerText = artist || '完整音樂';
                document.getElementById('cover').src = cover;

                // 使用 YouTube Embed 載入，100% 播放完整歌曲且不被跨域封鎖
                ytPlayer.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1`;
            }
        });
    </script>
</body>
</html>
