<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Lite - Invidious 完整播放</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 16px; padding-bottom: 90px; }
        .search-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #242424; color: #fff; outline: none; font-size: 14px; }
        button.src-btn { padding: 12px 20px; border-radius: 20px; border: none; background: #1DB954; color: #fff; font-weight: bold; cursor: pointer; }
        .card { display: flex; align-items: center; gap: 12px; background: #282828; padding: 10px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; }
        .card:hover { background: #383838; }
        .player { position: fixed; bottom: 0; left: 0; right: 0; background: #181818; padding: 12px; border-top: 1px solid #282828; display: flex; align-items: center; gap: 12px; z-index: 999; }
    </style>
</head>
<body>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜尋歌名 (例如: Sugar)...">
        <button class="src-btn" onclick="runSearch()">搜尋</button>
    </div>

    <h3>🔍 搜尋結果 (Invidious 完整串流)</h3>
    <div id="results"></div>

    <div class="player">
        <img id="cover" src="https://via.placeholder.com/48" style="width: 48px; height: 48px; border-radius: 4px; object-fit: cover;">
        <div style="flex: 1; overflow: hidden;">
            <div id="track-title" style="font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">未播放歌曲</div>
            <div id="track-artist" style="color: #b3b3b3; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">--</div>
        </div>
        <button id="play-btn" onclick="togglePlay()" style="background: #1DB954; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 16px; cursor: pointer;">▶</button>
    </div>

    <!-- 原生 HTML5 音訊播放器 -->
    <audio id="audio-player" playsinline></audio>

    <script>
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');

        // 免費穩定的 Invidious 節點列表 (若遇到節點失效會自動備援)
        const invidiousInstances = [
            'https://inv.riverside.rocks',
            'https://invidious.nerdvpn.de',
            'https://invidious.flokinet.to',
            'https://yt.artemislena.eu'
        ];

        audio.onplay = () => { playBtn.innerText = "⏸"; };
        audio.onpause = () => { playBtn.innerText = "▶"; };
        audio.onerror = () => {
            alert("音訊串流載入失敗，請嘗試再點擊一次歌曲！");
            playBtn.innerText = "▶";
        };

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') runSearch();
        });

        async function runSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('results');

            if (!query) return alert("請輸入關鍵字！");

            resultsContainer.innerHTML = '<p style="color:#1DB954;">⏳ 搜尋中...</p>';

            try {
                // 先透過 iTunes API 搜尋歌曲並取得漂亮的封面與歌名
                let url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=12`;
                let res = await fetch(url);
                let data = await res.json();

                resultsContainer.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    resultsContainer.innerHTML = '<p style="color:#888;">❌ 查無結果。</p>';
                    return;
                }

                data.results.forEach(item => {
                    const song = {
                        title: item.trackName || "未知歌名",
                        artist: item.artistName || "未知歌手",
                        cover: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '300x300bb') : 'https://via.placeholder.com/100',
                        query: `${item.artistName} ${item.trackName}`
                    };

                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <img src="${song.cover}" style="width:48px; height:48px; border-radius:4px;" onerror="this.src='https://via.placeholder.com/48'">
                        <div style="flex:1; overflow:hidden;">
                            <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${song.title}</div>
                            <div style="color:#b3b3b3; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${song.artist}</div>
                        </div>
                        <button style="background:#1DB954; color:#fff; border:none; padding:6px 12px; border-radius:12px; font-weight:bold;">播放完整版</button>
                    `;
                    div.onclick = () => playInvidiousStream(song);
                    resultsContainer.appendChild(div);
                });
            } catch (err) {
                resultsContainer.innerHTML = '<p style="color:red;">搜尋發生錯誤，請檢查網路。</p>';
            }
        }

        async function playInvidiousStream(song) {
            document.getElementById('track-title').innerText = song.title;
            document.getElementById('track-artist').innerText = song.artist;
            document.getElementById('cover').src = song.cover;
            playBtn.innerText = "⏳";

            let audioUrl = null;

            // 輪詢 Invidious 節點取得串流網址
            for (let instance of invidiousInstances) {
                try {
                    // 1. 搜尋 YouTube 影片 ID
                    let searchRes = await fetch(`${instance}/api/v1/search?q=${encodeURIComponent(song.query)}&type=video`);
                    let searchData = await searchRes.json();

                    if (searchData && searchData.length > 0) {
                        let videoId = searchData[0].videoId;

                        // 2. 獲取影片的詳細串流格式
                        let videoRes = await fetch(`${instance}/api/v1/videos/${videoId}`);
                        let videoData = await videoRes.json();

                        // 找尋純音訊格式 (adaptiveFormats 中 mimeType 為 audio)
                        if (videoData.adaptiveFormats) {
                            let audioFormat = videoData.adaptiveFormats.find(f => f.mimeType && f.mimeType.includes('audio'));
                            if (audioFormat && audioFormat.url) {
                                audioUrl = audioFormat.url;
                                break; // 成功找到音訊網址，跳出迴圈
                            }
                        }
                    }
                } catch (e) {
                    console.log(`節點 ${instance} 連線失敗，嘗試下一個...`);
                }
            }

            if (!audioUrl) {
                alert("無法解析該歌曲的音訊串流，請再試一次或更換歌曲！");
                playBtn.innerText = "▶";
                return;
            }

            // 將解析出來的純音訊網址丟給原生 HTML5 <audio> 播放
            audio.src = audioUrl;
            
            let playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    playBtn.innerText = "⏸";
                }).catch(err => {
                    console.log("手機需要手動點擊播放", err);
                    playBtn.innerText = "▶";
                });
            }
        }

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }
    </script>
</body>
</html>
