<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Lite - 免費 MP3 串流版</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 16px; padding-bottom: 90px; }
        .search-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #242424; color: #fff; outline: none; font-size: 14px; }
        button.src-btn { padding: 12px 20px; border-radius: 20px; border: none; background: #1DB954; color: #fff; font-weight: bold; cursor: pointer; }
        .card { display: flex; align-items: center; gap: 12px; background: #282828; padding: 10px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; }
        .card:hover { background: #383838; }
        .player { position: fixed; bottom: 0; left: 0; right: 0; background: #181818; padding: 12px; border-top: 1px solid #282828; display: flex; align-items: center; gap: 12px; z-index: 999; }
    </style>
</head>
<body>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜尋英文/流行歌名 (例如: Sugar, Stay, Believer)...">
        <button class="src-btn" onclick="runSearch()">搜尋</button>
    </div>

    <h3>🔍 搜尋結果 (完整 MP3 串流)</h3>
    <div id="results"></div>

    <div class="player">
        <img id="cover" src="https://via.placeholder.com/48" style="width: 48px; height: 48px; border-radius: 4px; object-fit: cover;">
        <div style="flex: 1; overflow: hidden;">
            <div id="track-title" style="font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">未播放歌曲</div>
            <div id="track-artist" style="color: #b3b3b3; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">--</div>
        </div>
        <button id="play-btn" onclick="togglePlay()" style="background: #1DB954; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 16px; cursor: pointer;">▶</button>
    </div>

    <audio id="audio-player" playsinline></audio>

    <script>
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');

        let playlist = [];
        let currentIndex = -1;

        audio.onplay = () => { playBtn.innerText = "⏸"; };
        audio.onpause = () => { playBtn.innerText = "▶"; };
        audio.onerror = () => {
            alert("音訊播放失敗，請更換歌曲試試！");
            playBtn.innerText = "▶";
        };

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') runSearch();
        });

        async function runSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('results');

            if (!query) return alert("請輸入關鍵字！");

            resultsContainer.innerHTML = '<p style="color:#1DB954;">⏳ 搜尋中...</p>';

            try {
                // 使用無版權限制的開放音樂 API
                let res = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}&limit=15`);
                let data = await res.json();

                resultsContainer.innerHTML = '';

                if (!data.success || !data.data || !data.data.results || data.data.results.length === 0) {
                    resultsContainer.innerHTML = '<p style="color:#888;">❌ 查無結果。</p>';
                    return;
                }

                playlist = data.data.results.map(song => {
                    // 取得最高音質的 MP3 連結
                    let downloadUrl = song.downloadUrl ? song.downloadUrl[song.downloadUrl.length - 1].url : '';
                    let imageCover = song.image ? song.image[song.image.length - 1].url : 'https://via.placeholder.com/300';

                    return {
                        title: song.name ? song.name.replace(/&quot;/g, '"').replace(/&#039;/g, "'") : "未知歌名",
                        artist: song.artists && song.artists.primary ? song.artists.primary.map(a => a.name).join(', ') : "未知歌手",
                        cover: imageCover,
                        mp3Url: downloadUrl
                    };
                }).filter(s => s.mp3Url !== '');

                playlist.forEach((song, index) => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <img src="${song.cover}" style="width:48px; height:48px; border-radius:4px;" onerror="this.src='https://via.placeholder.com/48'">
                        <div style="flex:1; overflow:hidden;">
                            <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${song.title}</div>
                            <div style="color:#b3b3b3; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${song.artist}</div>
                        </div>
                        <button style="background:#1DB954; color:#fff; border:none; padding:6px 12px; border-radius:12px; font-weight:bold;">播放完整版</button>
                    `;
                    div.onclick = () => playSongByIndex(index);
                    resultsContainer.appendChild(div);
                });
            } catch (err) {
                resultsContainer.innerHTML = '<p style="color:red;">搜尋時發生錯誤，請檢查網路連線。</p>';
                console.error(err);
            }
        }

        function playSongByIndex(index) {
            if (index < 0 || index >= playlist.length) return;

            currentIndex = index;
            const song = playlist[currentIndex];

            document.getElementById('track-title').innerText = song.title;
            document.getElementById('track-artist').innerText = song.artist;
            document.getElementById('cover').src = song.cover;

            audio.src = song.mp3Url;
            setupMediaSession(song);

            let playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    playBtn.innerText = "⏸";
                }).catch(err => {
                    console.log("手機需要點擊播放鍵", err);
                    playBtn.innerText = "▶";
                });
            }
        }

        function setupMediaSession(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    album: 'Spotify Lite',
                    artwork: [{ src: song.cover, sizes: '300x300', type: 'image/jpeg' }]
                });

                navigator.mediaSession.setActionHandler('play', () => audio.play());
                navigator.mediaSession.setActionHandler('pause', () => audio.pause());
                navigator.mediaSession.setActionHandler('previoustrack', () => playSongByIndex(currentIndex - 1));
                navigator.mediaSession.setActionHandler('nexttrack', () => playSongByIndex(currentIndex + 1));
            }
        }

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        audio.onended = () => {
            if (currentIndex + 1 < playlist.length) {
                playSongByIndex(currentIndex + 1);
            }
        };
    </script>
</body>
</html>
