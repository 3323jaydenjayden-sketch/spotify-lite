<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Lite</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="header">
        <h1>🎵 Spotify Lite</h1>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜尋歌曲或歌手 (例如: 告白氣球, 周杰倫)...">
        <button class="src-btn" id="searchBtn">搜尋</button>
    </div>

    <div class="section-title">搜尋結果</div>
    <div id="results"></div>

    <!-- 底部音樂播放面板 -->
    <div class="player-panel">
        <div class="player-header">
            <img id="cover" src="https://via.placeholder.com/48?text=Music" alt="封面">
            <div style="flex: 1; overflow: hidden;">
                <div id="track-title" class="player-title">尚未選擇歌曲</div>
                <div id="track-artist" class="player-artist">點擊列表歌曲即可開始播放</div>
            </div>
        </div>
        
        <!-- 防封鎖 YouTube Iframe 容器 -->
        <iframe 
            id="yt-frame" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
