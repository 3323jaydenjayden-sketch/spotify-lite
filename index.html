<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Lite - 本地音樂播放器</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #121212; color: #fff; font-family: sans-serif; margin: 0; padding: 16px; padding-bottom: 90px; }
        
        .upload-zone {
            border: 2px dashed #1DB954;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            background: #181818;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .upload-zone:hover { background: #242424; }
        
        .card { display: flex; align-items: center; gap: 12px; background: #282828; padding: 10px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; }
        .card:hover { background: #383838; }
        
        .player { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: #181818; padding: 12px; border-top: 1px solid #282828; 
            display: flex; align-items: center; gap: 12px; z-index: 999; 
        }
    </style>
</head>
<body>

    <!-- 檔案選取區 -->
    <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
        <p style="margin: 0; font-size: 16px; font-weight: bold; color: #1DB954;">📁 點擊選取你手機/電腦裡的 MP3 音樂</p>
        <p style="margin: 8px 0 0 0; color: #b3b3b3; font-size: 12px;">(支援多選 MP3 / M4A / WAV 檔案)</p>
    </div>
    <input type="file" id="fileInput" accept="audio/*" multiple style="display: none;" onchange="handleFiles(this.files)">

    <h3>🎵 播放清單</h3>
    <div id="playlist">
        <p style="color: #888; font-size: 14px;">目前清單是空的，請先點擊上方選取歌曲檔案。</p>
    </div>

    <!-- 底部播放列 -->
    <div class="player">
        <div style="width: 48px; height: 48px; background: #333; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 20px;">🎵</div>
        <div style="flex: 1; overflow: hidden;">
            <div id="track-title" style="font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">未播放歌曲</div>
            <div id="track-artist" style="color: #b3b3b3; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">請選擇音樂檔案</div>
        </div>
        <button id="play-btn" onclick="togglePlay()" style="background: #1DB954; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 16px; cursor: pointer;">▶</button>
    </div>

    <audio id="audio-player" playsinline></audio>

    <script>
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');

        let playlist = [];
        let currentIndex = -1;

        audio.onplay = () => { playBtn.innerText = "⏸"; };
        audio.onpause = () => { playBtn.innerText = "▶"; };

        function handleFiles(files) {
            if (files.length === 0) return;

            playlist = Array.from(files).map(file => {
                // 從檔名解析歌名與歌手（例："Jay Chou - 告白氣球.mp3"）
                let nameParts = file.name.replace(/\.[^/.]+$/, "").split(" - ");
                let artist = nameParts.length > 1 ? nameParts[0] : "本地音訊";
                let title = nameParts.length > 1 ? nameParts[1] : nameParts[0];

                return {
                    title: title,
                    artist: artist,
                    url: URL.createObjectURL(file) // 建立本地瀏覽器可讀取的 Blob 網址
                };
            });

            renderPlaylist();
            if (playlist.length > 0) {
                playSong(0); // 自動開始播放第一首
            }
        }

        function renderPlaylist() {
            const container = document.getElementById('playlist');
            container.innerHTML = '';

            playlist.forEach((song, index) => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <div style="width:40px; height:40px; background:#333; border-radius:4px; display:flex; align-items:center; justify-content:center;">🎵</div>
                    <div style="flex:1; overflow:hidden;">
                        <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${song.title}</div>
                        <div style="color:#b3b3b3; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${song.artist}</div>
                    </div>
                    <button style="background:#1DB954; color:#fff; border:none; padding:6px 12px; border-radius:12px; font-weight:bold;">播放</button>
                `;
                div.onclick = () => playSong(index);
                container.appendChild(div);
            });
        }

        function playSong(index) {
            if (index < 0 || index >= playlist.length) return;

            currentIndex = index;
            const song = playlist[currentIndex];

            document.getElementById('track-title').innerText = song.title;
            document.getElementById('track-artist').innerText = song.artist;

            audio.src = song.url;
            setupMediaSession(song);

            audio.play().then(() => {
                playBtn.innerText = "⏸";
            }).catch(e => console.log("等待點擊播放", e));
        }

        function setupMediaSession(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    album: 'Spotify Lite (本地播放)'
                });

                navigator.mediaSession.setActionHandler('play', () => audio.play());
                navigator.mediaSession.setActionHandler('pause', () => audio.pause());
                navigator.mediaSession.setActionHandler('previoustrack', () => playSong(currentIndex - 1));
                navigator.mediaSession.setActionHandler('nexttrack', () => playSong(currentIndex + 1));
            }
        }

        function togglePlay() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }

        // 播放完畢自動跳下一首
        audio.onended = () => {
            if (currentIndex + 1 < playlist.length) {
                playSong(currentIndex + 1);
            }
        };
    </script>
</body>
</html>
