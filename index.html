<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Lite - 音樂搜尋與播放器</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #121212; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; padding-bottom: 140px; }
        
        .search-bar { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px 16px; border-radius: 20px; border: none; background: #242424; color: #fff; outline: none; font-size: 14px; }
        button.src-btn { padding: 12px 20px; border-radius: 20px; border: none; background: #1DB954; color: #fff; font-weight: bold; cursor: pointer; }
        
        .card { display: flex; align-items: center; gap: 12px; background: #282828; padding: 10px; margin-bottom: 8px; border-radius: 8px; }
        .card:hover { background: #383838; }
        
        .btn-group { display: flex; gap: 6px; }
        .play-btn { background: #1DB954; color: #fff; border: none; padding: 8px 12px; border-radius: 16px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .yt-btn { background: #FF0000; color: #fff; border: none; padding: 8px 12px; border-radius: 16px; font-weight: bold; cursor: pointer; font-size: 12px; text-decoration: none; }
        
        /* 底部固定播放器 */
        .player-panel { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: #181818; border-top: 1px solid #282828; 
            padding: 12px; z-index: 999;
            display: flex; flex-direction: column; gap: 8px;
        }
        .player-info { display: flex; align-items: center; gap: 12px; }
        
        #player-frame {
            width: 100%;
            height: 80px;
            border: none;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="搜尋歌名 / 歌手 (例如: 告白氣球, 周杰倫, Taylor Swift)...">
        <button class="src-btn" onclick="runSearch()">搜尋</button>
    </div>

    <h3>🔍 搜尋結果</h3>
    <div id="results"></div>

    <!-- 底部播放介面 -->
    <div class="player-panel">
        <div class="player-info">
            <img id="cover" src="https://via.placeholder.com/48" style="width: 48px; height: 48px; border-radius: 4px; object-fit: cover;">
            <div style="flex: 1; overflow: hidden;">
                <div id="track-title" style="font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">未選擇歌曲</div>
                <div id="track-artist" style="color: #b3b3b3; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">請搜尋並點擊播放</div>
            </div>
            <a id="external-link" href="#" target="_blank" style="display:none;" class="yt-btn">在 YT 開啟</a>
        </div>
        
        <!-- 內嵌播放器視窗 -->
        <iframe id="player-frame" allow="autoplay; encrypted-media"></iframe>
    </div>

    <script>
        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            if (e.key === 'Enter') runSearch();
        });

        async function runSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('results');

            if (!query) return alert("請輸入關鍵字！");

            resultsContainer.innerHTML = '<p style="color:#1DB954;">⏳ 搜尋音樂庫中...</p>';

            try {
                let url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=15`;
                let res = await fetch(url);
                let data = await res.json();

                resultsContainer.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    resultsContainer.innerHTML = '<p style="color:#888;">❌ 查無結果，請嘗試換個關鍵字搜尋。</p>';
                    return;
                }

                data.results.forEach(item => {
                    const song = {
                        title: item.trackName || "未知歌名",
                        artist: item.artistName || "未知歌手",
                        cover: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '300x300bb') : 'https://via.placeholder.com/300',
                        previewUrl: item.previewUrl,
                        query: `${item.artistName} ${item.trackName}`
                    };

                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <img src="${song.cover}" style="width:48px; height:48px; border-radius:4px;" onerror="this.src='https://via.placeholder.com/48'">
                        <div style="flex:1; overflow:hidden;">
                            <div style="font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${song.title}</div>
                            <div style="color:#b3b3b3; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${song.artist}</div>
                        </div>
                        <div class="btn-group">
                            <button class="play-btn" onclick='playEmbedded("${encodeURIComponent(song.query)}", "${encodeURIComponent(song.title)}", "${encodeURIComponent(song.artist)}", "${song.cover}")'>內嵌播放</button>
                            <a class="yt-btn" href="https://www.youtube.com/results?search_query=${encodeURIComponent(song.query)}" target="_blank">YouTube</a>
                        </div>
                    `;
                    resultsContainer.appendChild(div);
                });
            } catch (err) {
                resultsContainer.innerHTML = '<p style="color:red;">搜尋連線錯誤，請重試。</p>';
            }
        }

        function playEmbedded(encodedQuery, encodedTitle, encodedArtist, cover) {
            const query = decodeURIComponent(encodedQuery);
            const title = decodeURIComponent(encodedTitle);
            const artist = decodeURIComponent(encodedArtist);

            document.getElementById('track-title').innerText = title;
            document.getElementById('track-artist').innerText = artist;
            document.getElementById('cover').src = cover;

            const frame = document.getElementById('player-frame');
            const extLink = document.getElementById('external-link');
            
            // 帶入網域 origin 防止部份權限擋存
            const embedUrl = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=1`;
            
            frame.src = embedUrl;
            frame.style.display = 'block';

            // 設定外部開啟連結，做為備用方案
            extLink.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
            extLink.style.display = 'inline-block';
        }
    </script>
</body>
</html>
